ecap="round" stroke-linejoin="round" marker-end="url(#mrkr4-21)"/><rect x="44.4001" y="1099.95" width="11.9998" height="9.59985" stroke-width="7.2" stroke-linecap="butt" fill="#FFFFFF"/><text fill="#1076A7" font-family="Segoe UI" font-size="66.6664%" x="44.4" y="1107.15">Yes</text></g><g id="shape118-51" transform="translate(499.5 -697.5)"><path d="M0 1082.25 85.5 1039.5 171 1082.25 85.5 1125 0 1082.25Z" stroke="#A200FF" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/><text fill="#002060" font-family="Segoe UI" font-size="66.6664%" x="37.19" y="1075.05">Did a conditional forwarder<tspan font-size="100%" x="38.98" dy="1.2em">return a terminal response</tspan><tspan font-size="100%" x="60.21" dy="1.2em">for this query?</tspan></text></g><g id="shape120-56" transform="translate(576 -801)"><path d="M9 1125 9 1135.96" stroke="#1998D6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrkr4-21)"/></g><g id="shape121-61" transform="translate(388.125 -713.25)"><rect x="0" y="1071" width="72" height="54" stroke="#00B050" stroke-linecap="round" stroke-linejoin="round" fill="#C4E49E"/><text fill="#002060" font-family="Segoe UI" font-weight="700" font-size="66.6664%" x="7.79" y="1100.4">Send Response</text></g><g id="shape122-64" transform="translate(499.5 -731.25)"><path d="M0 1116-32.33 1116" stroke="#1998D6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrkr4-21)"/><rect x="-24.9733" y="1104.45" width="11.9998" height="9.59985" stroke-width="7.2" stroke-linecap="butt" fill="#FFFFFF"/><text fill="#1076A7" font-family="Segoe UI" font-size="66.6664%" x="-24.97" y="1111.65">Yes</text></g><g id="shape123-71" transform="translate(255.6 -389.25)"><path d="M0 1082.25 85.5 1039.5 171 1082.25 85.5 1125 0 1082.25Z" stroke="#A200FF" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/><text fill="#002060" font-family="Segoe UI" font-size="66.6664%" x="47.84" y="1079.85">Are there server-level<tspan font-size="100%" x="44.64" dy="1.2em">forwarders configured?</tspan></text></g><g id="shape124-75" transform="translate(332.1 -785.25)"><path d="M9 1125 9 1324.96" stroke="#1998D6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrkr4-21)"/><rect x="13.564" y="1140.45" width="10.6718" height="9.59985" stroke-width="7.2" stroke-linecap="butt" fill="#FFFFFF"/><text fill="#1076A7" font-family="Segoe UI" font-size="66.6664%" x="13.56" y="1147.65">No</text></g><g id="shape125-82" transform="translate(499.5 -591.75)"><path d="M0 1082.25 85.5 1039.5 171 1082.25 85.5 1125 0 1082.25Z" stroke="#A200FF" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/><text fill="#002060" font-family="Segoe UI" font-size="66.6664%" x="40.8" y="1075.05">Is recursion permitted for<tspan font-size="100%" x="31.55" dy="1.2em">this conditional forwarder, and</tspan><tspan font-size="100%" x="48.56" dy="1.2em">is time still available?</tspan></text></g><g id="shape126-87" transform="translate(576 -697.5)"><path d="M9 1125 9 1138.21" stroke="#1998D6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrkr4-21)"/><rect x="14.689" y="1130.89" width="10.6718" height="9.59985" stroke-width="7.2" stroke-linecap="butt" fill="#FFFFFF"/><text fill="#1076A7" font-family="Segoe UI" font-size="66.6664%" x="14.69" y="1138.09">No</text></g><g id="shape127-94" transform="translate(388.125 -607.5)"><rect x="0" y="1071" width="72" height="54" stroke="#EE0000" stroke-linecap="round" stroke-linejoin="round" fill="#FFBDBD"/><text fill="#002060" font-family="Segoe UI" font-weight="700" font-size="66.6664%" x="7.74" y="1100.4">Send SERVFAIL</text></g><g id="shape128-97" transform="translate(499.5 -625.5)"><path d="M0 1116-32.33 1116" stroke="#1998D6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrkr4-21)"/><rect x="-24.3094" y="1104.45" width="10.6718" height="9.59985" stroke-width="7.2" stroke-linecap="butt" fill="#FFFFFF"/><text fill="#1076A7" font-family="Segoe UI" font-size="66.6664%" x=