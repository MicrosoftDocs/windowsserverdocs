<svg width="930" height="1500" viewBox="0 0 697.5 1125" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" color-interpolation-filters="sRGB" stroke-linecap="square" stroke-miterlimit="3" fill="none" fill-rule="evenodd" font-size="12" xml:space="preserve" overflow="visible" style="background-color: white" role="img" aria-labelledby="dns-flow-title" aria-describedby="dns-flow-desc"><title id="dns-flow-title">Flowchart of DNS Server query resolution through local data, conditional forwarders, delegations, server-level forwarders, and root hints.</title><desc id="dns-flow-desc">Start: DNS Server receives a recursive client query. It checks whether authoritative data or the cache can provide a terminal response. If yes, it sends the response. If no, it checks whether the query matches a conditional forwarder zone. If the query matches, it queries the conditional forwarders in order and subject to timeouts. If a conditional forwarder returns a terminal response, it sends the response. Otherwise, it checks whether recursion is permitted for the conditional forwarder and whether time is still available. If either condition is not met, it sends SERVFAIL. If both conditions are met, the flow continues to the delegation decision. If the query does not match a conditional forwarder zone, the flow also continues to the delegation decision. The server checks whether an applicable delegation identifies the next authoritative servers. If yes, it resolves iteratively using the delegated name servers, then sends the resulting answer, NODATA, NXDOMAIN, or SERVFAIL. If no, it checks whether server-level forwarders are configured. If yes, it queries the server-level forwarders in the active order, subject to forwarding and recursion timeouts. If a server-level forwarder returns a terminal DNS response, it sends the response. If no server-level forwarder returns a terminal response, it checks whether root hints fallback is enabled and whether time remains in RecursionTimeout. If no, it sends SERVFAIL. If yes, it uses root hints for iterative resolution, then sends the resulting answer, NODATA, NXDOMAIN, or SERVFAIL. If no server-level forwarders are configured, it makes the same root hints fallback check.</desc><defs id="Markers"><marker refX="-7.04" markerUnits="strokeWidth" orient="auto" id="mrkr4-21" stroke="#1998D6" stroke-width="0.284091" fill="#1998D6" overflow="visible"><use width="100%" height="100%" xlink:href="#lend4" transform="scale(-3.52 -3.52)"></use></marker><g id="lend4"><path d="M2 1 0 0 2-1 2 1"/></g></defs><g><g id="shape42-1" transform="translate(305.1 -1074.37)"><path d="M13.5 1125 58.5 1125C65.9558 1125 72 1118.96 72 1111.5 72 1104.04 65.9558 1098 58.5 1098L13.5 1098C6.04416 1098-1.77636e-15 1104.04-3.55271e-15 1111.5-5.32907e-15 1118.96 6.04416 1125 13.5 1125Z" stroke="#7F7F7F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/><text fill="#002060" font-family="Segoe UI" font-weight="700" font-size="66.6664%" x="26.9" y="1113.9">Start</text></g><g id="shape43-4" transform="translate(305.1 -1002.37)"><path d="M-13.5 1125 58.5 1125 85.5 1071 13.5 1071-13.5 1125Z" stroke="#005695" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/><text fill="#002060" font-family="Segoe UI" font-size="66.6664%" x="17.11" y="1090.8">Received a <tspan font-size="100%" x="20.34" dy="1.2em">recursive </tspan><tspan font-size="100%" x="15.37" dy="1.2em">client query</tspan></text></g><g id="shape44-9" transform="translate(255.6 -896.625)"><path d="M0 1082.25 85.5 1039.5 171 1082.25 85.5 1125 0 1082.25Z" stroke="#A200FF" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/><text fill="#002060" font-family="Segoe UI" font-size="66.6664%" x="30.4" y="1079.85">Can authoritative data or cache <tspan font-size="100%" x="34.52" dy="1.2em">provide a terminal response?</tspan></text></g><g id="shape46-13" transform="translate(549 -912.375)"><rect x="0" y="1071"